kind = "mobile"
previewPath = "/pu-transit-driver/"
title = "PU Transit Driver"
description = "Minimal native driver companion for PU Transit (Parul University bus tracking). Signs in with the same Firebase identity as the web app, runs the shared trip-tracking state machine against the existing /api/tracking contract, and keeps publishing bus location from a background task while the phone screen is off. Built first as the NAT-01 feasibility build: it records an on-device evidence log of every sample, heartbeat, network loss and token refresh so a single-device screen-off run can be measured."
version = "1.0.0"
id = "artifacts/pu-transit-driver"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pu-transit-driver/" ]
localPort = 20831

[services.development]
run = "pnpm --filter @workspace/pu-transit-driver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pu-transit-driver", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pu-transit-driver", "run", "serve" ]

[services.env]
PORT = "20831"
BASE_PATH = "/pu-transit-driver/"
